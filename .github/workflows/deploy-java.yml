name: General Java 21 Deploy

on:
  workflow_call:
    inputs:
      dockerfile_path:
        required: true
        type: string
      app_name:
        required: true
        type: string
      host_port:
        required: true
        type: number
      extra_ports:
        description: >-
          Optional additional "-p host:container" mappings, space separated.
          Needed for TCP listeners that Kong cannot proxy, such as the GPS
          device server on 8842. Defaults to empty, so callers that do not
          pass it keep the current behaviour (no published ports).
        required: false
        type: string
        default: ''

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Run tests
        run: mvn test

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY_NAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f ${{ inputs.dockerfile_path }} -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.EC2_HOST }}
          username: ${{ vars.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            ENV_FILE=${{ vars.ENV_FILE_BASE }}/${{ inputs.app_name }}.env
            IMAGE=${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY_NAME }}:${{ github.sha }}
            EXTRA_PORTS="${{ inputs.extra_ports }}"
            test -r "$ENV_FILE" || { echo "No se puede leer $ENV_FILE"; exit 1; }
            aws ecr get-login-password --region ${{ vars.AWS_REGION }} | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}
            docker stop ${{ inputs.app_name }} || true
            docker rm ${{ inputs.app_name }} || true
            docker pull "$IMAGE"
            docker run -d --name ${{ inputs.app_name }} --network ${{ vars.DOCKER_NETWORK_NAME }} --restart unless-stopped --env-file "$ENV_FILE" $EXTRA_PORTS "$IMAGE"
