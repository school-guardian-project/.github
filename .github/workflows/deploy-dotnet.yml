name: General .NET 10 Deploy

on:
  workflow_call:
    inputs:
      dockerfile_path:
        required: true
        type: string
      app_name:
        required: true
        type: string
      host_port:
        required: true
        type: number

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run tests
        run: dotnet test --verbosity normal

      - name: Debug OIDC Token
        run: |
          echo "Fetching OIDC token..."
          TOKEN_RESPONSE=$(curl -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")
          ID_TOKEN=$(echo $TOKEN_RESPONSE | jq -r '.value')
          echo "Decoded Token Payload:"
          echo $ID_TOKEN | cut -d'.' -f2 | base64 -d | jq .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY_NAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f ${{ inputs.dockerfile_path }} -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.EC2_HOST }}
          username: ${{ vars.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            ENV_FILE=${{ vars.ENV_FILE_BASE }}/${{ inputs.app_name }}.env
            IMAGE=${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY_NAME }}:${{ github.sha }}
            test -r "$ENV_FILE" || { echo "No se puede leer $ENV_FILE"; exit 1; }
            # La EC2 usa su propio rol IAM, 'aws' funciona automáticamente sin credenciales manuales.
            aws ecr get-login-password --region ${{ vars.AWS_REGION }} | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}
            
            docker stop ${{ inputs.app_name }} || true
            docker rm ${{ inputs.app_name }} || true
            docker pull ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY_NAME }}:${{ github.sha }}
            docker run -d --name ${{ inputs.app_name }} --network ${{ vars.DOCKER_NETWORK_NAME }} ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY_NAME }}:${{ github.sha }} --restart unless-stopped --env-file "$ENV_FILE" "$IMAGE"
